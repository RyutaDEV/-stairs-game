<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Subaru Rhythm</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: Arial;
  color: #00ffcc;
}

/* UI */
#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 100;
}

/* Linha (AGORA CORRETA) */
#line {
  position: absolute;
  bottom: 260px;
  width: 100%;
  height: 4px;
  background: #00ffcc;
  box-shadow: 0 0 15px #00ffcc;
  z-index: 5;
}

/* Subaru (AJUSTADO) */
#gif {
  position: absolute;
  bottom: 0px;
  left: 50%;
  transform: translateX(-50%);
  width: 400px;
  border-radius: 15px;
  box-shadow: 0 0 25px #00ffcc;
  opacity: 0.85;
  z-index: 1;
}

/* Notas */
.note {
  position: absolute;
  width: 60px;
  height: 60px;
  background: #00ffcc;
  border-radius: 10px;
  text-align: center;
  line-height: 60px;
  font-weight: bold;
  color: black;
  box-shadow: 0 0 15px #00ffcc;
  z-index: 10;
}

/* Feedback */
#feedback {
  position: absolute;
  bottom: 300px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 40px;
  z-index: 20;
}

/* Menu */
#menu {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  background: black;
  z-index: 200;
}

/* Game Over */
#gameover {
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 999;
}

button {
  padding: 10px 30px;
  font-size: 20px;
  background: #00ffcc;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}
</style>

</head>
<body>

<div id="menu">
  <h1>Subaru Rhythm</h1>
  <button onclick="startGame()">PLAY</button>
</div>

<div id="gameover">
  <h1>💀 GAME OVER 💀</h1>
  <button onclick="location.reload()">RESTART</button>
</div>

<div id="ui">
  Pontos: <span id="score">0</span><br>
  Combo: <span id="combo">0</span><br>
  Erros: <span id="miss">0</span>/5
</div>

<div id="feedback"></div>
<div id="line"></div>

<img id="gif" src="auramonster.gif">

<!-- 🎵 MUSICA -->
<audio id="music" src="auramusic.mp3"></audio>
<audio id="hitSound" src="clickaura.mp3"></audio>
<script>
let score = 0;
let combo = 0;
let misses = 0;

const keys = ["1","2","3","4"];
const lanes = [20, 40, 60, 80];

let notes = [];
let running = false;

const music = document.getElementById("music");
const hitSound = document.getElementById("hitSound");
/* LINHA ALINHADA */
const lineY = () => window.innerHeight - 260;

function startGame() {
  document.getElementById("menu").style.display = "none";
  running = true;

  music.currentTime = 0;
  music.play(); // 🎵 começa música

  setInterval(spawnNote, 900);
  requestAnimationFrame(update);
}

function spawnNote() {
  if (!running) return;

  let lane = Math.floor(Math.random() * 4);

  let note = document.createElement("div");
  note.className = "note";
  note.innerText = lane + 1;

  note.style.left = lanes[lane] + "%";
  note.style.top = "0px";

  document.body.appendChild(note);

  notes.push({
    el: note,
    lane: lane,
    y: 0,
    hit: false
  });
}

function update() {
  if (!running) return;

  notes.forEach(n => {
    n.y += 3.5;
    n.el.style.top = n.y + "px";

    if (n.y > lineY() + 60 && !n.hit) {
      n.hit = true;
      n.el.remove();
      miss();
    }
  });

  requestAnimationFrame(update);
}

document.addEventListener("keydown", (e) => {
  let lane = keys.indexOf(e.key.toLowerCase());
  if (lane === -1 || !running) return;

  let best = null;
  let bestDist = 999;

  notes.forEach(n => {
    if (n.lane === lane && !n.hit) {
      let dist = Math.abs(n.y - lineY());
      if (dist < bestDist) {
        bestDist = dist;
        best = n;
      }
    }
  });
if (best) {

  if (bestDist < 40) {
    combo++;
    score += 150;
    show("PERFECT");

  } else if (bestDist < 80) {
    combo++;
    score += 80;
    show("GOOD");

  } else {
    miss();
    return;
  }

  // 🔊 SOM
  hitSound.currentTime = 0;
  hitSound.play();

  // ✨ PARTÍCULAS
  let rect = best.el.getBoundingClientRect();
  spawnParticles(rect.left + 30, rect.top + 30);

  best.hit = true;
  best.el.remove();

} else {
  miss();
}

  updateUI();
});

function miss() {
  combo = 0;
  misses++;
  show("MISS");

  if (misses >= 5) {
    running = false;
    music.pause(); // para música
    document.getElementById("gameover").style.display = "flex";
  }
}

function show(txt) {
  const f = document.getElementById("feedback");
  f.innerText = txt;
  setTimeout(() => f.innerText = "", 300);
}

function updateUI() {
  document.getElementById("score").innerText = score;
  document.getElementById("combo").innerText = combo;
  document.getElementById("miss").innerText = misses;
}
function spawnParticles(x, y) {
  for (let i = 0; i < 10; i++) {
    let p = document.createElement("div");

    p.style.position = "absolute";
    p.style.width = "6px";
    p.style.height = "6px";
    p.style.background = "#00ffcc";
    p.style.left = x + "px";
    p.style.top = y + "px";
    p.style.borderRadius = "50%";
    p.style.pointerEvents = "none";
    p.style.zIndex = 50;

    document.body.appendChild(p);

    let angle = Math.random() * 2 * Math.PI;
    let speed = Math.random() * 4 + 2;

    let vx = Math.cos(angle) * speed;
    let vy = Math.sin(angle) * speed;

    let life = 30;

    function animate() {
      if (life-- <= 0) {
        p.remove();
        return;
      }

      x += vx;
      y += vy;

      p.style.left = x + "px";
      p.style.top = y + "px";
      p.style.opacity = life / 30;

      requestAnimationFrame(animate);
    }

    animate();
  }
}
</script>

</body>
</html>
