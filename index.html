 <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Subaru Rhythm</title>

<style>
body {
  margin:0;
  overflow:hidden;
  background:black;
  font-family:Arial;
  color:#00ffcc;
}

/* fundo fix */
body.stage1, body.stage2, body.stage3 {
  background-color:black !important;
}
body.stage1 { background: radial-gradient(circle,#1a0033,black); }
body.stage2 { background: radial-gradient(circle,#2a0050,black); }
body.stage3 { background: radial-gradient(circle,#3a0070,black); }

/* boss */
body.boss { box-shadow: inset 0 0 150px red; }

/* barra vida */
#bossHP {
  position:absolute;
  top:0; left:0;
  height:8px;
  width:100%;
  background:red;
  display:none;
}

/* UI */
#ui { position:absolute; top:10px; left:10px; z-index:100; }

/* linha */
#line {
  position:absolute;
  bottom:260px;
  width:100%;
  height:4px;
  background:#00ffcc;
  box-shadow:0 0 15px #00ffcc;
}
#line.boss {
  background:red;
  box-shadow:0 0 20px red;
}

/* subaru */
#gif {
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:400px;
  display:none;
  border-radius:15px;
  box-shadow:0 0 25px #00ffcc;
}
body.boss #gif { box-shadow:0 0 30px red; }

/* notas */
.note {
  position:absolute;
  width:60px;
  height:60px;
  background:#00ffcc;
  border-radius:10px;
  text-align:center;
  line-height:60px;
  font-weight:bold;
  color:black;
  box-shadow:0 0 15px #00ffcc;
}
.note.boss { background:red; box-shadow:0 0 20px red; }
.note.fake { background:purple !important; }

/* feedback */
#feedback {
  position:absolute;
  bottom:300px;
  left:50%;
  transform:translateX(-50%);
  font-size:40px;
  z-index:999;
}

/* menus */
#menu,#shop {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:black;
}
#shop { display:none; }

#gameover {
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

button {
  padding:10px 30px;
  font-size:20px;
  background:#00ffcc;
  border:none;
  border-radius:10px;
  cursor:pointer;
  margin:5px;
}
</style>
</head>

<body>

<div id="bossHP"></div>

<div id="game">

<div id="menu">
  <h1>Subaru Rhythm</h1>
  <button onclick="startGame()">PLAY</button>
  <button onclick="openShop()">LOJA</button>
</div>

<div id="shop">
  <h1>🛒 LOJA</h1>
  <p>Pontos: <span id="coins">0</span></p>
  <p>Multiplicador: x<span id="mult">1</span></p>

  <button onclick="buyMultiplier()">Multiplicador (500)</button>
  <button onclick="buySpeed()">Velocidade (400)</button>
  <button onclick="buySlowmo()">Slow Motion (600)</button>
  <button onclick="buyAuto()">Auto Combo (800)</button>
  <button onclick="resetStats()">RESETAR STATUS</button>

  <h2>🎭 Skins</h2>
  <button onclick="setSkin('auramonster.gif')">Skin 1</button>
  <button onclick="setSkin('auramonsterskin2.gif')">Skin 2</button>

  <button onclick="closeShop()">VOLTAR</button>
</div>

<div id="gameover">
  <h1>💀 GAME OVER 💀</h1>
  <button onclick="location.reload()">RESTART</button>
</div>

<div id="ui">
  Pontos: <span id="score">0</span><br>
  Combo: <span id="combo">0</span><br>
  Erros: <span id="miss">0</span>/5
</div>

<div id="feedback"></div>
<div id="line"></div>
<img id="gif" src="auramonster.gif">

<audio id="music" src="auramusic.mp3"></audio>
<audio id="bossMusic" src="boss.mp3"></audio>
<audio id="bossMusic2" src="boss2.mp3"></audio>
<audio id="bossMusic3" src="boss3.mp3"></audio>
<audio id="hitSound" src="clickaura.mp3"></audio>

</div>

<script>
// SAVE
function load(k,d){let v=localStorage.getItem(k);try{return v?JSON.parse(v):d}catch{return v||d}}
function save(){
localStorage.setItem("coins",coins);
localStorage.setItem("mult",multiplier);
localStorage.setItem("speed",speed);
localStorage.setItem("slowmo",slowmo);
localStorage.setItem("autocomb",autocomb);
localStorage.setItem("skin",JSON.stringify(skin));
}

// STATS
let score=0,combo=0,misses=0;
let multiplier=load("mult",1);
let coins=load("coins",0);
let speed=load("speed",3.5);
let slowmo=load("slowmo",0);
let autocomb=load("autocomb",0);
let skin=load("skin","auramonster.gif");

let bossMode=false;
let bossStage=0;
let bossHP=100;

const bossBar=document.getElementById("bossHP");

let spawnLoop=null;

const keys=["1","2","3","4"];
const lanes=[20,40,60,80];

let notes=[];
let running=false;

const music=document.getElementById("music");
const bossMusic=document.getElementById("bossMusic");
const bossMusic2=document.getElementById("bossMusic2");
const bossMusic3=document.getElementById("bossMusic3");
const hitSound=document.getElementById("hitSound");
const line=document.getElementById("line");

const lineY=()=>window.innerHeight-260;

// MENU
function startGame(){
document.getElementById("menu").style.display="none";
document.getElementById("gif").style.display="block";
line.style.display="block";

running=true;
score=0; combo=0; misses=0;
bossMode=false;
bossStage=0;
bossBar.style.display="none";

document.getElementById("gif").src=skin;

music.currentTime=0;
music.play();

spawnLoop=setInterval(spawnNote,900);
requestAnimationFrame(update);
}

function openShop(){
document.getElementById("menu").style.display="none";
document.getElementById("shop").style.display="flex";
line.style.display="none";
updateShopUI();
}

function closeShop(){
document.getElementById("shop").style.display="none";
document.getElementById("menu").style.display="flex";
}

function updateShopUI(){
document.getElementById("coins").innerText=coins;
document.getElementById("mult").innerText=multiplier.toFixed(1);
}

function buyMultiplier(){if(coins>=500){coins-=500; multiplier+=0.5;updateShopUI(); save();}}
function buySpeed(){if(coins>=400){coins-=400; speed+=0.5;updateShopUI(); save();}}
function buySlowmo(){if(coins>=600){coins-=600; slowmo++;updateShopUI(); save();}}
function buyAuto(){if(coins>=800){coins-=800; autocomb++;updateShopUI(); save();}}
function resetStats(){multiplier=1; speed=3.5; slowmo=0; autocomb=0; coins=0;save(); updateShopUI();}

function setSkin(s){
  skin = s;
  save();

  let gif = document.getElementById("gif");
  gif.src = skin;
}
// BOSS
function startBoss(stage=1){
bossMode=true;
bossStage=stage;
bossHP=100;

bossBar.style.display="block";

document.body.classList.add("boss");
line.classList.add("boss");

document.body.classList.remove("stage1","stage2","stage3");
if(stage===1) document.body.classList.add("stage1");
if(stage===2) document.body.classList.add("stage2");
if(stage===3) document.body.classList.add("stage3");

music.pause();
bossMusic.pause();
bossMusic2.pause();
bossMusic3.pause();

if(stage===1){bossMusic.play();document.getElementById("gif").src="boss.gif";}
if(stage===2){bossMusic2.play();document.getElementById("gif").src="boss2.gif";}
if(stage===3){bossMusic3.play();document.getElementById("gif").src="boss3.gif";}
}

// GAME
function spawnNote(){
if(!running) return;

let lane=Math.floor(Math.random()*4);
let note=document.createElement("div");

note.className="note";
if(bossMode) note.classList.add("boss");

note.innerText=lane+1;
note.style.left=lanes[lane]+"%";
note.style.top="0px";

document.body.appendChild(note);

let data={el:note,lane,y:0,hit:false,fake:false};

if(bossMode && Math.random()<0.25){
data.fake=true;
note.classList.add("fake");
}

notes.push(data);
}

function update(){
if(!running) return;

notes.forEach(n=>{
let sp=speed;

if(slowmo>0 && Math.random()<0.1) sp*=0.5;
if(bossStage===1) sp*=1.4;
if(bossStage===2) sp*=1.7;
if(bossStage===3) sp*=2.2;

n.y+=sp;
n.el.style.top=n.y+"px";

if(n.y>lineY()+60&&!n.hit){
n.hit=true;
n.el.remove();
if(!n.fake){ miss(); }
}
});

requestAnimationFrame(update);
}

// INPUT
document.addEventListener("keydown",(e)=>{
let lane=keys.indexOf(e.key);
if(lane===-1||!running) return;

let best=null,dist=999;

notes.forEach(n=>{
if(n.lane===lane&&!n.hit&&!n.fake){
let d=Math.abs(n.y-lineY());
if(d<dist){dist=d;best=n;}
}
});

if(best){
if(dist<40){combo++; score+=150*multiplier; coins+=150;show("PERFECT");}
else if(dist<80){combo++; score+=80*multiplier; coins+=80;show("GOOD");}
else return miss();

if(combo>=40 && bossStage<1) startBoss(1);
if(combo>=60 && bossStage<2) startBoss(2);
if(combo>=80 && bossStage<3) startBoss(3);

if(bossMode){
bossHP--;
bossBar.style.width=bossHP+"%";

if(bossHP<=0){
bossMode=false;
bossStage=0;
bossBar.style.display="none";
document.body.classList.remove("boss","stage1","stage2","stage3");
music.play();
}
}

hitSound.currentTime=0;
hitSound.play();

let r=best.el.getBoundingClientRect();
spawnParticles(r.left+30,r.top+30,bossMode?"red":"#00ffcc");

best.hit=true;
best.el.remove();
}else miss();

save();
updateUI();
});

// PARTICULAS ORIGINAL
function spawnParticles(x,y,color){
for(let i=0;i<10;i++){
let p=document.createElement("div");
p.style.position="absolute";
p.style.width="6px";
p.style.height="6px";
p.style.background=color;
p.style.left=x+"px";
p.style.top=y+"px";
p.style.borderRadius="50%";
document.body.appendChild(p);

let vx=(Math.random()-0.5)*6;
let vy=(Math.random()-0.5)*6;
let life=30;

function anim(){
if(life--<=0) return p.remove();
x+=vx;y+=vy;
p.style.left=x+"px";
p.style.top=y+"px";
p.style.opacity=life/30;
requestAnimationFrame(anim);
}
anim();
}
}

// MISS
function miss(){
if(autocomb>0 && Math.random()<0.3){
show("SAVE!");
return;
}

combo=0; misses++;

bossMode=false;
bossStage=0;
bossBar.style.display="none";

document.body.classList.remove("boss","stage1","stage2","stage3");
line.classList.remove("boss");

bossMusic.pause();
bossMusic2.pause();
bossMusic3.pause();
music.play();

document.getElementById("gif").src=skin;

show("MISS");

if(misses>=5){
running=false;
music.pause();
clearInterval(spawnLoop);
document.getElementById("gameover").style.display="flex";
}
}

function show(t){
let f=document.getElementById("feedback");
f.innerText=t;
setTimeout(()=>f.innerText="",300);
}

function updateUI(){
document.getElementById("score").innerText=Math.floor(score);
document.getElementById("combo").innerText=combo;
document.getElementById("miss").innerText=misses;
}
</script>

</body>
</html>
