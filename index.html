<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Subaru Reflexo Game</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    overflow: hidden;
    background: #031a0f; /* 🔥 verde bem escuro */
}


/* FUNDO */
#menu {
    position: absolute;
    width: 100%;
    height: 100%;
    background: url("https://moewalls.com/wp-content/uploads/2022/07/subaru-and-beatrice-smoking-together-rezero-thumb.jpg") no-repeat center;
    background-size: cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

/* BOTÃO PLAY */
#playBtn {
    padding: 20px 50px;
    font-size: 30px;
    background: #00ff99;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
}

#playBtn:hover {
    transform: scale(1.1);
}

/* JOGO */
#game {
    display: none;
}

/* SCORE */
#score {
    position: absolute;
    top: 20px;
    left: 20px;
    font-size: 28px;
    color: rgb(255, 251, 6);
}

/* LETRA */
#letter {
    position: absolute;
    font-size: 90px;
    font-weight: bold;
    color: #00ff99;
    text-shadow: 0 0 20px #00ff99;
    z-index: 2;
}

/* GIF */
#subaru {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 750px;
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(0,255,150,0.5);
    z-index: 1;
}

/* GAME OVER */
#gameOver {
    display: none;
    font-size: 70px;
    color: rgb(149, 0, 194);
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
}

/* SHAKE */
.shake {
    animation: shake 0.3s;
}

@keyframes shake {
    0% { transform: translate(0,0); }
    25% { transform: translate(10px,-10px); }
    50% { transform: translate(-10px,10px); }
    75% { transform: translate(10px,10px); }
    100% { transform: translate(0,0); }
}
</style>
</head>

<body>

<!-- MENU -->
<div id="menu">
    <h1 style="color:rgb(0, 255, 42); font-size:60px;">Simulador de Aura Monster</h1>
    <button id="playBtn">PLAY</button>
</div>

<!-- JOGO -->
<div id="game">
    <div id="score">Pontos: 0</div>
    <div id="letter">A</div>
    <img id="subaru" src="auragif.gif">
    <div id="gameOver">💀 GAME OVER 💀</div>
</div>

<!-- SONS -->
<audio id="hitSound" src="clickaura.mp3"></audio>
<audio id="failSound" src="erroaura.mp3"></audio>
<audio id="bgMusic" src="auramusic.mp3" loop></audio>

<script>
const letters = ["1","2","3","4"];

let currentLetter = "";
let score = 0;
let speed = 2000; // 🔥 começa mais tranquilo
let timeout;

const menu = document.getElementById("menu");
const game = document.getElementById("game");
const playBtn = document.getElementById("playBtn");

const letterDiv = document.getElementById("letter");
const scoreDiv = document.getElementById("score");
const gameOverText = document.getElementById("gameOver");

const hitSound = document.getElementById("hitSound");
const failSound = document.getElementById("failSound");
const bgMusic = document.getElementById("bgMusic");

/* START GAME */
playBtn.onclick = () => {
    menu.style.display = "none";
    game.style.display = "block";

    bgMusic.play().catch(()=>{});

    spawnLetter();
};

function spawnLetter() {
    clearTimeout(timeout);

    currentLetter = letters[Math.floor(Math.random() * letters.length)];
    letterDiv.textContent = currentLetter;

    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 300);

    letterDiv.style.left = x + "px";
    letterDiv.style.top = y + "px";

    timeout = setTimeout(() => {
        gameOver();
    }, speed);
}

function gameOver() {
    failSound.play();
    document.body.classList.add("shake");

    bgMusic.pause();
    bgMusic.currentTime = 0;

    gameOverText.style.display = "block";

    setTimeout(resetGame, 2000);
}

function resetGame() {
    score = 0;
    speed = 2000; // 🔥 reset mais justo

    scoreDiv.textContent = "Pontos: 0";
    gameOverText.style.display = "none";

    bgMusic.play().catch(()=>{});

    spawnLetter();
}

document.addEventListener("keydown", (e) => {
    if (!currentLetter) return;

    // 🔥 ignora teclas inválidas
    if (!letters.includes(e.key)) return;

    if (e.key === currentLetter) {
        clearTimeout(timeout);

        score++;
        scoreDiv.textContent = "Pontos: " + score;

        hitSound.currentTime = 0;
        hitSound.play();

        // 🔥 agora sobe a dificuldade de 15 em 15
        if (score % 15 === 0) {
            speed = Math.max(800, speed - 150);
        }

        // 🔥 pequeno delay (fica mais justo)
        setTimeout(spawnLetter, 150);

    } else {
        gameOver();
    }
});
</script>
</body>
</html>
